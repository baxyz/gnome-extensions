name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: extension
    attributes:
      label: Extension
      description: Which extension does this feature relate to?
      options:
        - browser-hub
        - firefox-profiles
        - new extension (describe below)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried?
