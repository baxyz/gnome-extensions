name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: lts/*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  analyze:
    name: Analyze (shexli)
    runs-on: ubuntu-latest
    # shexli 0.2.1 used to segfault deterministically on this extension's
    # real dist/extension.js — root-caused to a memory-corruption bug in
    # tree-sitter 0.26.0 specifically (the version a fresh, unconstrained
    # `pip install shexli` always resolves, since it satisfies shexli's own
    # `tree-sitter>=0.25.0` requirement). Confirmed by bisecting dependency
    # versions directly: tree-sitter 0.25.1/0.25.2 analyze this exact package
    # cleanly and consistently (multiple repeat runs, zero crashes); 0.26.0
    # crashes consistently (Segfault or Bus error, varying by run — a
    # hallmark of real memory corruption, not a deterministic logic bug).
    # tree-sitter-javascript's version didn't matter either way. `pipx inject`
    # below pins the working version into shexli's own venv without needing
    # a shexli release (none newer than 0.2.1 exists).
    #
    # continue-on-error here only keeps the *workflow run* from failing
    # overall — it does NOT change this job's own check-run conclusion, which
    # branch protection's "required status checks" gate reads independently.
    # So the job itself must never fail: shexli's outcome is captured into an
    # output instead of the step's exit code, and reported as its own row in
    # the PR summary below without affecting this job's (or the merge's)
    # pass/fail state. Kept as a safety net even though shexli should now
    # actually run to completion, in case some future PR's content or a
    # shexli/tree-sitter update reintroduces a crash.
    outputs:
      shexli_result: ${{ steps.shexli.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: pipx install shexli
      # --force: pipx inject can silently skip if it thinks the package is
      # already injected (observed even right after a fresh pipx install, on
      # an unrelated pre-existing pipx state) — without --force that leaves
      # shexli's own tree-sitter>=0.25.0 resolution (currently 0.26.0, the
      # buggy version) in place with no error, defeating this pin silently.
      - run: pipx inject shexli 'tree-sitter==0.25.2' --force
      - name: Run shexli (advisory only, never fails this job)
        id: shexli
        run: |
          if pnpm -r shexli; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, format, test, build, analyze]
    permissions:
      pull-requests: write
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            // shexli is advisory-only (see the analyze job's comment) — its
            // result comes from a job output, not needs.analyze.result
            // (which is always 'success', since the job itself never fails
            // any more), and it's reported separately from the blocking
            // checks rather than folded into `allGood`.
            const blocking = {
              lint:   '${{ needs.lint.result }}',
              format: '${{ needs.format.result }}',
              test:   '${{ needs.test.result }}',
              build:  '${{ needs.build.result }}',
            };
            const shexliResult = '${{ needs.analyze.outputs.shexli_result }}';
            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const rows = Object.entries(blocking)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .concat(`| shexli (advisory) | ${icon(shexliResult)} ${shexliResult} |`)
              .join('\n');
            const allGood = Object.values(blocking).every((r) => r === 'success');
            // Each entry here is a complete markdown block (heading, table,
            // note, timestamp) — joined with a blank line between every one
            // of them. Building this as one flat array of lines and filtering
            // out the empty-string spacers (as a previous version did) drops
            // the blank line GitHub needs to end the table, which merges the
            // following prose into the table's last cell instead of rendering
            // it as its own paragraph.
            const table = ['| Check | Status |', '|-------|--------|', rows].join('\n');
            const note = shexliResult !== 'success'
              ? '_shexli is advisory-only (known upstream crash — see the workflow file) and does not block merging._'
              : null;
            const updated = `_Updated: ${new Date().toUTCString()} — commit \`${{ github.sha }}\`_`;
            const body = [
              '<!-- quality-checks-summary -->',
              `## Quality Checks ${allGood ? '✅ All passing' : '❌ Some checks failed'}`,
              table,
              note,
              updated,
            ].filter(Boolean).join('\n\n');
            const marker = '<!-- quality-checks-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
