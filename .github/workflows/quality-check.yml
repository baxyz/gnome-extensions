name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: lts/*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  analyze:
    name: Analyze (shexli)
    runs-on: ubuntu-latest
    # tree-sitter 0.26.0 — what a fresh, unconstrained `pip install shexli`
    # always resolves, since it satisfies shexli's own tree-sitter>=0.25.0
    # requirement — has a memory-corruption bug that crashes shexli on this
    # extension's real packaged output (Segfault or Bus error, varying by
    # run, the hallmark of memory corruption rather than a deterministic
    # logic bug). tree-sitter 0.25.1/0.25.2 analyze it cleanly and
    # consistently; tree-sitter-javascript's version doesn't matter either
    # way. `pipx inject` below pins the working version into shexli's own
    # venv. See tooling/scripts/shexli.sh for how a real finding turns into
    # this job's own exit code (shexli's own CLI always exits 0, findings or
    # not).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: pipx install shexli
      # --force: pipx inject can silently skip if it thinks the package is
      # already injected (observed even right after a fresh pipx install, on
      # an unrelated pre-existing pipx state) — without --force that leaves
      # shexli's own tree-sitter>=0.25.0 resolution (currently 0.26.0, the
      # buggy version) in place with no error, defeating this pin silently.
      - run: pipx inject shexli 'tree-sitter==0.25.2' --force
      - run: pnpm -r shexli

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, format, test, build, analyze]
    permissions:
      pull-requests: write
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const results = {
              lint:   '${{ needs.lint.result }}',
              format: '${{ needs.format.result }}',
              test:   '${{ needs.test.result }}',
              build:  '${{ needs.build.result }}',
              shexli: '${{ needs.analyze.result }}',
            };
            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const rows = Object.entries(results)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .join('\n');
            const allGood = Object.values(results).every((r) => r === 'success');
            // Each entry here is a complete markdown block (heading, table,
            // timestamp), joined with a blank line between every one of
            // them — a table needs a blank line after it or GitHub merges
            // whatever follows into its last cell instead of rendering it
            // as its own paragraph.
            const table = ['| Check | Status |', '|-------|--------|', rows].join('\n');
            const updated = `_Updated: ${new Date().toUTCString()} — commit \`${{ github.sha }}\`_`;
            const body = [
              '<!-- quality-checks-summary -->',
              `## Quality Checks ${allGood ? '✅ All passing' : '❌ Some checks failed'}`,
              table,
              updated,
            ].join('\n\n');
            const marker = '<!-- quality-checks-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
