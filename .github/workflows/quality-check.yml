name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: lts/*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  analyze:
    name: Analyze (shexli)
    runs-on: ubuntu-latest
    # shexli 0.2.1 segfaults deterministically on extensions with multiple
    # locally-imported JS files (use-after-free in its tree-sitter usage —
    # a Node outlives the Tree it came from). Not blocking until upstream
    # ships a fix; findings still show up in the job log when it doesn't crash.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: pipx install shexli
      - run: pnpm -r shexli

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, format, test, build, analyze]
    permissions:
      pull-requests: write
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint:   '${{ needs.lint.result }}',
              format: '${{ needs.format.result }}',
              test:   '${{ needs.test.result }}',
              build:  '${{ needs.build.result }}',
              shexli: '${{ needs.analyze.result }}',
            };
            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const rows = Object.entries(results)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .join('\n');
            const allGood = Object.values(results).every((r) => r === 'success');
            const body = [
              '<!-- quality-checks-summary -->',
              `## Quality Checks ${allGood ? '✅ All passing' : '❌ Some checks failed'}`,
              '',
              '| Check | Status |',
              '|-------|--------|',
              rows,
              '',
              `_Updated: ${new Date().toUTCString()} — commit \`${{ github.sha }}\`_`,
            ].join('\n');
            const marker = '<!-- quality-checks-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
