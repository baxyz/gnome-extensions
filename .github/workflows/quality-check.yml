name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: lts/*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  analyze:
    name: Analyze (shexli)
    runs-on: ubuntu-latest
    # shexli 0.2.1 used to segfault deterministically on this extension's
    # real packaged output — root-caused to a memory-corruption bug in
    # tree-sitter 0.26.0 specifically (the version a fresh, unconstrained
    # `pip install shexli` always resolves, since it satisfies shexli's own
    # `tree-sitter>=0.25.0` requirement). Confirmed by bisecting dependency
    # versions directly: tree-sitter 0.25.1/0.25.2 analyze this exact package
    # cleanly and consistently (multiple repeat runs, zero crashes); 0.26.0
    # crashes consistently (Segfault or Bus error, varying by run — a
    # hallmark of real memory corruption, not a deterministic logic bug).
    # tree-sitter-javascript's version didn't matter either way. `pipx inject`
    # below pins the working version into shexli's own venv without needing
    # a shexli release (none newer than 0.2.1 exists). Blocking again now
    # that it reliably runs to completion — see tooling/scripts/shexli.sh for
    # how a real finding turns into this job's own exit code (shexli's own
    # CLI always exits 0, findings or not).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: pipx install shexli
      # --force: pipx inject can silently skip if it thinks the package is
      # already injected (observed even right after a fresh pipx install, on
      # an unrelated pre-existing pipx state) — without --force that leaves
      # shexli's own tree-sitter>=0.25.0 resolution (currently 0.26.0, the
      # buggy version) in place with no error, defeating this pin silently.
      - run: pipx inject shexli 'tree-sitter==0.25.2' --force
      - run: pnpm -r shexli

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, format, test, build, analyze]
    permissions:
      pull-requests: write
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            // shexli is a real blocking check again now that the crash is
            // fixed (see the analyze job's comment) — folded back into the
            // same table as the other checks, no special-casing needed.
            const results = {
              lint:   '${{ needs.lint.result }}',
              format: '${{ needs.format.result }}',
              test:   '${{ needs.test.result }}',
              build:  '${{ needs.build.result }}',
              shexli: '${{ needs.analyze.result }}',
            };
            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'skipped' ? '⏭️' : '⚠️';
            const rows = Object.entries(results)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .join('\n');
            const allGood = Object.values(results).every((r) => r === 'success');
            // Each entry here is a complete markdown block (heading, table,
            // timestamp) — joined with a blank line between every one of
            // them. Building this as one flat array of lines and filtering
            // out the empty-string spacers (as a previous version did) drops
            // the blank line GitHub needs to end the table, which merges the
            // following prose into the table's last cell instead of rendering
            // it as its own paragraph.
            const table = ['| Check | Status |', '|-------|--------|', rows].join('\n');
            const updated = `_Updated: ${new Date().toUTCString()} — commit \`${{ github.sha }}\`_`;
            const body = [
              '<!-- quality-checks-summary -->',
              `## Quality Checks ${allGood ? '✅ All passing' : '❌ Some checks failed'}`,
              table,
              updated,
            ].join('\n\n');
            const marker = '<!-- quality-checks-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
